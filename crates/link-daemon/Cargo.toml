[package]
name = "link-daemon"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "linkd"
path = "src/main.rs"
required-features = ["daemon", "gstreamer"]

[features]
default = ["daemon", "gstreamer"]
daemon = ["dep:link-ipc"]
gstreamer = ["dep:link-media", "link-media/gstreamer"]
pipewire = ["dep:link-audio", "link-audio/pipewire"]
host-ai = ["dep:link-effects", "link-effects/host-ai"]
network = ["dep:link-ipc", "dep:link-media", "link-ipc/network", "link-media/network"]
sdk = ["dep:link-sdk-bridge", "link-sdk-bridge/sdk"]

[dependencies]
clap.workspace = true
ctrlc.workspace = true
humantime.workspace = true
link-audio = { workspace = true, optional = true }
link-core.workspace = true
link-effects = { workspace = true, optional = true }
link-ipc = { workspace = true, optional = true }
link-media = { workspace = true, optional = true }
link-linux = { path = "../link-linux", version = "=0.1.0" }
link-sdk-bridge = { workspace = true, optional = true }
link-v4l2.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
