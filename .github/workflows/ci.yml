name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Formatting
        run: devenv shell -- cargo fmt --all -- --check
      - name: Clippy
        run: devenv shell -- cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: devenv shell -- cargo test --workspace --all-features --locked
      - name: Minimal feature set
        run: devenv shell -- cargo check --workspace --all-targets --no-default-features --locked
      - name: Complete feature set
        run: devenv shell -- cargo check --workspace --all-targets --all-features --locked
      - name: Dependency policy
        run: devenv shell -- cargo deny --all-features check
      - name: Release asset validation
        run: |
          set -euo pipefail
          devenv shell -- bash -c \
            'find packaging -type f -name "*.sh" -print0 | xargs -0 shellcheck'
          devenv shell -- actionlint
          devenv shell -- cargo build --locked --package link-daemon --bin linkd
          service=$(mktemp --suffix=.service)
          trap 'rm -f -- "$service"' EXIT
          sed "s|^ExecStart=/usr/bin/linkd$|ExecStart=$PWD/target/debug/linkd|" \
            packaging/systemd/linkd.service >"$service"
          devenv shell -- systemd-analyze verify --man=no "$service"
          devenv shell -- udevadm verify packaging/udev/70-linkctl.rules
          nix flake check --no-build --all-systems

  xu-abi-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: XU ABI and parser tests
        run: devenv shell -- cargo test -p link-uvc-xu --all-features --locked
