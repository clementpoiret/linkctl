[workspace]
members = [
  "crates/link-audio",
  "crates/link-cli",
  "crates/link-core",
  "crates/link-daemon",
  "crates/link-ipc",
  "crates/link-linux",
  "crates/link-media",
  "crates/link-profiles",
  "crates/link-testkit",
  "crates/link-uvc-xu",
  "crates/link-v4l2",
]
resolver = "3"

[workspace.package]
version = "1.0.1"
edition = "2024"
repository = "https://github.com/clementpoiret/linkctl"
publish = false
license = "MIT OR Apache-2.0"
rust-version = "1.97.1"

[workspace.dependencies]
alsa = "0.12.1"
base64 = "0.22.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
clap_complete = "4.6.6"
ctrlc = "3.5.1"
gstreamer = { version = "0.25.3", features = ["v1_26"] }
gstreamer-app = { version = "0.25.2", features = ["v1_26"] }
humantime = "2.3.0"
pipewire = "0.10.1"
rustix = { version = "1.1.4", features = ["event", "fs", "net", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.44"
tempfile = "3.27.0"
thiserror = "2.0.20"
toml = "0.9.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
udev = "0.9.3"
v4l2r = "0.0.8"
zstd = "0.13.3"

link-audio = { path = "crates/link-audio", version = "=1.0.1" }
link-core = { path = "crates/link-core", version = "=1.0.1" }
link-ipc = { path = "crates/link-ipc", version = "=1.0.1" }
link-media = { path = "crates/link-media", version = "=1.0.1" }
link-profiles = { path = "crates/link-profiles", version = "=1.0.1" }
link-uvc-xu = { path = "crates/link-uvc-xu", version = "=1.0.1" }
link-v4l2 = { path = "crates/link-v4l2", version = "=1.0.1" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
